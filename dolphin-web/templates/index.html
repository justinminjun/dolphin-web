{% extends "base.html" %}
{% block title %}Lost & Found — Chadwick International{% endblock %}

{% block content %}
<div class="page">
  <style>
    /* ── SEARCH ──────────────────────────────── */
    .search-wrap {
      padding: 12px 16px 8px;
      background: var(--surface);
      border-bottom: 1px solid var(--border-light);
    }
    .search-input {
      width: 100%; background: var(--surface-alt);
      border: none; border-radius: var(--radius-full);
      padding: 10px 16px; font-size: 15px;
      color: var(--text-primary); outline: none;
    }
    .search-input::placeholder { color: var(--text-muted); }

    /* ── FILTER TABS ─────────────────────────── */
    .filter-row {
      display: flex; gap: 8px;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow-x: auto; scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-tab {
      padding: 6px 14px; border-radius: var(--radius-full);
      background: var(--surface-alt); border: none;
      font-size: 12px; font-weight: 600; color: var(--text-secondary);
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
    .filter-tab.active {
      background: var(--primary); color: #fff;
    }

    /* ── FEED LIST ───────────────────────────── */
    .feed-list { padding: 16px; display: flex; flex-direction: column; gap: 16px; }

    /* ── CARD ────────────────────────────────── */
    .card {
      background: var(--surface);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-md);
      cursor: pointer;
      display: block; text-decoration: none;
    }
    .card:hover { transform: translateY(-1px); transition: transform .15s; }
    .card.resolved { opacity: .6; }

    /* image */
    .card-img-wrap { position: relative; }
    .card-img {
      width: 100%; height: 180px;
      object-fit: cover; display: block;
      background: var(--surface-alt);
    }
    .card-no-img {
      width: 100%; height: 180px;
      background: var(--surface-alt);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: var(--text-muted); font-weight: 500;
    }

    /* badges on image */
    .img-badge {
      position: absolute; top: 10px; left: 10px;
      padding: 4px 10px; border-radius: var(--radius-full);
      font-size: 11px; font-weight: 600;
    }
    .img-badge.lost  { background: var(--lost-bg);  color: var(--lost-text); }
    .img-badge.found { background: var(--found-bg); color: var(--found-text); }
    .img-count {
      position: absolute; bottom: 10px; right: 10px;
      background: rgba(0,0,0,.6); color: #fff;
      padding: 3px 8px; border-radius: var(--radius-full);
      font-size: 11px; font-weight: 600;
    }
    .img-resolved {
      position: absolute; top: 10px; right: 10px;
      background: #ECFDF5; color: #059669;
      padding: 4px 10px; border-radius: var(--radius-full);
      font-size: 11px; font-weight: 700;
      border: 1px solid #A7F3D0;
    }

    /* content */
    .card-content { padding: 16px; }
    .card-title {
      font-size: 17px; font-weight: 600; color: var(--text-primary);
      margin-bottom: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-meta {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }
    .card-location {
      font-size: 12px; color: var(--text-secondary);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .card-time { font-size: 12px; color: var(--text-muted); flex-shrink: 0; margin-left: 8px; }

    /* tags */
    .tags-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
    .tag-chip {
      background: var(--tag-bg); color: var(--tag-text);
      padding: 3px 8px; border-radius: var(--radius-full);
      font-size: 12px; font-weight: 500;
    }

    /* author */
    .author-row {
      display: flex; align-items: center; gap: 8px;
      border-top: 1px solid var(--border-light); padding-top: 10px;
    }
    .author-avatar {
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--primary-light);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;
      overflow: hidden;
    }
    .author-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .author-name { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
    .role-badge {
      margin-left: auto; padding: 1px 6px; border-radius: 4px;
      font-size: 9px; font-weight: 600;
    }
    .role-badge.student  { background: #EEF2FF; color: #4338CA; }
    .role-badge.faculty  { background: #FEF3C7; color: #D97706; }

    /* ── EMPTY STATE ─────────────────────────── */
    .empty { text-align: center; padding: 60px 16px; }
    .empty-title { font-size: 17px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
    .empty-sub   { font-size: 14px; color: var(--text-secondary); }

    /* ── FAB ─────────────────────────────────── */
    .fab {
      position: fixed; bottom: 24px; right: 20px;
      display: flex; align-items: center; gap: 6px;
      background: #059669; color: #fff;
      border: none; border-radius: 28px;
      padding: 14px 20px; font-size: 16px; font-weight: 700;
      box-shadow: var(--shadow-lg); cursor: pointer;
      text-decoration: none;
      z-index: 100;
    }
    .fab:hover { background: #047857; }
    .fab svg { width: 20px; height: 20px; }
  </style>

  <!-- Search -->
  <div class="search-wrap">
    <input class="search-input" type="search" id="searchInput"
           placeholder="Search items by name, location, or tag..." />
  </div>

  <!-- Filter tabs -->
  <div class="filter-row">
    <button class="filter-tab active" data-filter="all"      onclick="setFilter(this)">All</button>
    <button class="filter-tab"        data-filter="lost"     onclick="setFilter(this)">Lost</button>
    <button class="filter-tab"        data-filter="found"    onclick="setFilter(this)">Found</button>
    <button class="filter-tab"        data-filter="resolved" onclick="setFilter(this)">Resolved</button>
  </div>

  <!-- Feed -->
  <div class="feed-list" id="feedList">
    <div class="loader-wrap"><div class="spin"></div></div>
  </div>
</div>

{% if user %}
<a class="fab" href="/post/new">
  <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  Report
</a>
{% endif %}
{% endblock %}

{% block scripts %}
<script type="module">
import {
  collection, query, orderBy, onSnapshot, doc, getDoc
} from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

let allPosts   = [];
let authorCache = {};
let currentFilter = 'all';
let currentSearch = '';

function setFilter(btn) {
  document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = btn.dataset.filter;
  render();
}
window.setFilter = setFilter;

document.getElementById('searchInput').addEventListener('input', e => {
  currentSearch = e.target.value.toLowerCase();
  render();
});

async function fetchAuthorPhoto(authorId, db) {
  if (!authorId || authorId in authorCache) return;
  authorCache[authorId] = null;
  try {
    const snap = await getDoc(doc(db, 'users', authorId));
    if (snap.exists()) authorCache[authorId] = snap.data().photoURL || null;
  } catch {}
  render();
}

function filterPosts(posts) {
  return posts.filter(p => {
    if (currentFilter === 'lost'     && p.postType !== 'lost')      return false;
    if (currentFilter === 'found'    && p.postType !== 'found')     return false;
    if (currentFilter === 'resolved' && p.status   !== 'resolved')  return false;
    if (currentFilter === 'all'      && p.status   === 'resolved')  return false;

    if (!currentSearch) return true;
    const q = currentSearch;
    return (p.title||'').toLowerCase().includes(q) ||
           (p.description||'').toLowerCase().includes(q) ||
           (p.location||'').toLowerCase().includes(q) ||
           (p.tags||[]).some(t => t.toLowerCase().includes(q));
  });
}

function cardHTML(post) {
  const isLost     = post.postType === 'lost';
  const isResolved = post.status === 'resolved';
  const displayImg = post.imageUrls?.length > 0 ? post.imageUrls[0] : (post.imageUrl || null);
  const imgCount   = post.imageUrls ? post.imageUrls.length : (post.imageUrl ? 1 : 0);

  const imgHTML = displayImg
    ? `<img class="card-img" src="${displayImg}" alt="" loading="lazy" />`
    : `<div class="card-no-img">No Image</div>`;

  const tagsHTML = (post.tags||[]).slice(0,3).map(t =>
    `<span class="tag-chip">#${t}</span>`).join('');

  const photo    = authorCache[post.authorId];
  const initials = (post.authorName||'U')[0].toUpperCase();
  const avatarInner = photo
    ? `<img src="${photo}" alt="" />`
    : initials;

  const role    = getRoleLabel(post.authorEmail||'');
  const roleCls = role === 'Student' ? 'student' : 'faculty';

  const ts = post.createdAt ? timeAgo(post.createdAt) : '';

  return `
    <a class="card${isResolved?' resolved':''}" href="/post/${post.id}">
      <div class="card-img-wrap">
        ${imgHTML}
        <span class="img-badge ${isLost?'lost':'found'}">${isLost?'Lost':'Found'}</span>
        ${imgCount>1 ? `<span class="img-count">${imgCount} photos</span>` : ''}
        ${isResolved ? `<span class="img-resolved">✓ Resolved</span>` : ''}
      </div>
      <div class="card-content">
        <p class="card-title">${post.title||''}</p>
        <div class="card-meta">
          <span class="card-location">${post.location||'Unknown location'}</span>
          <span class="card-time">${ts}</span>
        </div>
        ${tagsHTML ? `<div class="tags-row">${tagsHTML}</div>` : ''}
        <div class="author-row">
          <div class="author-avatar">${avatarInner}</div>
          <span class="author-name">${post.authorName||''}</span>
          ${post.authorEmail ? `<span class="role-badge ${roleCls}">${role}</span>` : ''}
        </div>
      </div>
    </a>`;
}

function render() {
  const list    = document.getElementById('feedList');
  const filtered = filterPosts(allPosts);
  if (!filtered.length) {
    const msg = currentSearch ? 'No results found' : 'No items posted yet';
    const sub = currentSearch ? 'Try a different search term' : 'Be the first to report a lost or found item!';
    list.innerHTML = `<div class="empty"><p class="empty-title">${msg}</p><p class="empty-sub">${sub}</p></div>`;
    return;
  }
  list.innerHTML = filtered.map(cardHTML).join('');
}

window.addEventListener('firebase-ready', () => {
  const { db } = window._fb;
  const q = query(collection(db, 'posts'), orderBy('createdAt', 'desc'));
  onSnapshot(q, snap => {
    allPosts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    allPosts.forEach(p => { if (p.authorId) fetchAuthorPhoto(p.authorId, db); });
    render();
  }, () => render());
});
</script>
{% endblock %}
