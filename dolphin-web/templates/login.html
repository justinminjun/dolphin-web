<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Lost & Found</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      background: linear-gradient(160deg, #0C2340 0%, #1A3A5C 100%);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .page {
      width: 100%; max-width: 420px;
      display: flex; flex-direction: column; align-items: center; gap: 32px;
    }

    /* Logo area */
    .logo-wrap { text-align: center; }
    .logo-title { font-size: 36px; font-weight: 800; color: #fff; letter-spacing: -1px; }
    .logo-sub   { font-size: 16px; color: rgba(255,255,255,.8); margin-top: 4px; font-weight: 500; }

    /* Card */
    .card {
      width: 100%; background: #fff; border-radius: 20px;
      padding: 32px; box-shadow: 0 8px 24px rgba(0,0,0,.25);
    }
    .card-title {
      font-size: 22px; font-weight: 700; color: #0C2340;
      text-align: center; margin-bottom: 8px;
    }
    .card-sub {
      font-size: 14px; color: #4A5E78; text-align: center;
      margin-bottom: 24px; line-height: 1.5;
    }

    /* Google button */
    .google-btn {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
      background: #0C2340; color: #fff; border: none; border-radius: 14px;
      padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer;
      font-family: inherit; box-shadow: 0 4px 12px rgba(12,35,64,.2);
    }
    .google-btn:hover { background: #1A3A5C; }
    .google-btn:disabled { opacity: .6; cursor: not-allowed; }
    .google-icon {
      font-size: 18px; font-weight: 700; color: #fff;
      background: rgba(255,255,255,.15); width: 28px; height: 28px;
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    /* Divider */
    .divider { display: flex; align-items: center; margin: 20px 0; gap: 12px; }
    .divider-line { flex: 1; height: 1px; background: #D8DFE9; }
    .divider-text { font-size: 12px; color: #8A9BB5; white-space: nowrap; }

    /* Info */
    .info { font-size: 12px; color: #4A5E78; text-align: center; line-height: 1.5; }

    /* Error */
    .error-msg {
      background: #FEF2F2; border: 1px solid #FECACA;
      color: #DC2626; border-radius: 10px; padding: 12px;
      font-size: 13px; font-weight: 600; margin-top: 16px;
      display: none; text-align: center;
    }
    .error-msg.show { display: block; }

    /* Toast */
    #toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
      background: #1E293B; color: #fff; border-radius: 999px;
      padding: 10px 20px; font-size: 14px; font-weight: 600;
      opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="page">
    <div class="logo-wrap">
      <p class="logo-title">🐬 Lost & Found</p>
      <p class="logo-sub">Chadwick International</p>
    </div>

    <div class="card">
      <h1 class="card-title">Welcome</h1>
      <p class="card-sub">Sign in with your school account to report or find lost items.</p>

      <button class="google-btn" id="loginBtn" onclick="handleGoogleLogin()">
        <span class="google-icon">G</span>
        Continue with Google
      </button>

      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">School email only</span>
        <div class="divider-line"></div>
      </div>

      <p class="info">Only @chadwickschool.org accounts can access this app. Your real name is displayed for accountability.</p>

      <div class="error-msg" id="errorMsg"></div>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
    import { getAuth, signInWithPopup, GoogleAuthProvider } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';

    const cfg = {{ firebase_cfg | safe }};
    const app  = initializeApp(cfg);
    const auth = getAuth(app);

    window.handleGoogleLogin = async function() {
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('errorMsg');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      err.classList.remove('show');

      try {
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        const result   = await signInWithPopup(auth, provider);
        const idToken  = await result.user.getIdToken();

        const r = await fetch('/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idToken }),
        });
        const data = await r.json();

        if (data.success) {
          location.href = '/';
        } else {
          err.textContent = data.error || 'Access denied.';
          err.classList.add('show');
          btn.disabled = false;
          btn.innerHTML = '<span class="google-icon">G</span> Continue with Google';
        }
      } catch(e) {
        if (e.code !== 'auth/popup-closed-by-user') {
          err.textContent = e.message || 'Login failed.';
          err.classList.add('show');
        }
        btn.disabled = false;
        btn.innerHTML = '<span class="google-icon">G</span> Continue with Google';
      }
    };
  </script>
</body>
</html>
