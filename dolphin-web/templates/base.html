<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Lost & Found — Chadwick International{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:       #0C2340;
      --primary-light: #1A3A5C;
      --primary-dark:  #061729;
      --accent:        #C9A96E;
      --success:       #10B981;
      --danger:        #EF4444;
      --warning:       #F97316;

      --bg:            #F5F7FA;
      --surface:       #FFFFFF;
      --surface-alt:   #EDF1F7;
      --text-primary:  #0C2340;
      --text-secondary:#4A5E78;
      --text-muted:    #8A9BB5;
      --border:        #D8DFE9;
      --border-light:  #EDF1F7;

      --tag-bg:        #E8EDF4;
      --tag-text:      #0C2340;
      --lost-bg:       #FEF2F2;
      --lost-text:     #DC2626;
      --found-bg:      #ECFDF5;
      --found-text:    #059669;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 20px;
      --radius-full: 999px;

      --shadow-sm: 0 1px 3px rgba(12,35,64,.06);
      --shadow-md: 0 4px 12px rgba(12,35,64,.10);
      --shadow-lg: 0 8px 24px rgba(12,35,64,.14);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* ── NAV ─────────────────────────────────────────────── */
    .navbar {
      position: sticky; top: 0; z-index: 200;
      background: var(--primary);
      display: flex; align-items: center;
      padding: 0 16px;
      height: 56px;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    .navbar-brand {
      display: flex; align-items: center; gap: 8px;
      text-decoration: none;
      font-size: 18px; font-weight: 800; color: #fff;
      letter-spacing: -.3px;
    }
    .navbar-brand span { font-size: 22px; }
    .navbar-spacer { flex: 1; }
    .nav-report-btn {
      display: flex; align-items: center; gap: 6px;
      background: #059669; color: #fff;
      border: none; border-radius: var(--radius-full);
      padding: 8px 16px; font-size: 14px; font-weight: 700;
      cursor: pointer; text-decoration: none;
      margin-right: 10px;
    }
    .nav-report-btn:hover { background: #047857; }
    .nav-avatar-wrap { position: relative; }
    .nav-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      cursor: pointer; border: 2px solid rgba(255,255,255,.3);
      object-fit: cover; background: var(--primary-light);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: #fff; overflow: hidden;
    }
    .nav-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .nav-dropdown {
      display: none; position: absolute; top: calc(100% + 8px); right: 0;
      background: var(--surface); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg); min-width: 180px;
      border: 1px solid var(--border); overflow: hidden;
    }
    .nav-dropdown.open { display: block; }
    .nav-dropdown a, .nav-dropdown button {
      display: block; width: 100%; padding: 12px 16px;
      font-size: 14px; font-weight: 600; color: var(--text-primary);
      text-decoration: none; background: none; border: none;
      cursor: pointer; text-align: left;
    }
    .nav-dropdown a:hover, .nav-dropdown button:hover { background: var(--surface-alt); }
    .nav-dropdown button.danger { color: var(--danger); }
    .nav-login-btn {
      color: #fff; font-size: 14px; font-weight: 600;
      text-decoration: none; padding: 7px 14px;
      border: 1.5px solid rgba(255,255,255,.4); border-radius: var(--radius-full);
    }
    .nav-login-btn:hover { background: rgba(255,255,255,.1); }

    /* ── PAGE CONTENT ────────────────────────────────────── */
    .page { max-width: 640px; margin: 0 auto; padding-bottom: 100px; }
    .page-wide { max-width: 900px; margin: 0 auto; padding-bottom: 60px; }

    /* ── TOAST ───────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
      background: #1E293B; color: #fff; border-radius: var(--radius-full);
      padding: 10px 20px; font-size: 14px; font-weight: 600;
      z-index: 9999; opacity: 0; transition: opacity .2s;
      pointer-events: none; white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    /* ── MODAL OVERLAY ───────────────────────────────────── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.5); z-index: 500;
      align-items: flex-end; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-sheet {
      background: var(--surface); border-radius: 24px 24px 0 0;
      padding: 20px; width: 100%; max-width: 640px;
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }
    .modal-handle {
      width: 40px; height: 4px; background: var(--border);
      border-radius: 2px; margin: 0 auto 16px;
    }
    .modal-title { font-size: 17px; font-weight: 800; color: var(--text-primary); margin-bottom: 16px; }
    .menu-option {
      display: flex; align-items: center; gap: 12px;
      background: var(--surface-alt); border-radius: var(--radius-lg);
      padding: 16px; margin-bottom: 10px; cursor: pointer;
      border: none; width: 100%; text-align: left;
      font-size: 16px; font-weight: 700; color: var(--text-primary);
    }
    .menu-option:hover { opacity: .85; }
    .menu-option.danger { color: var(--danger); }
    .menu-option.success { color: #059669; }
    .menu-option svg { width: 20px; height: 20px; flex-shrink: 0; }
    .sheet-cancel {
      width: 100%; background: #F1F5F9; border: none;
      border-radius: var(--radius-lg); padding: 16px;
      font-size: 16px; font-weight: 700; color: var(--text-primary);
      cursor: pointer; margin-top: 4px;
    }
    .sheet-cancel:hover { background: var(--border); }

    /* ── UTILITIES ───────────────────────────────────────── */
    .divider { height: 1px; background: var(--border-light); margin: 0 16px; }
    .spin {
      width: 32px; height: 32px; border: 3px solid var(--border);
      border-top-color: var(--primary); border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-wrap { display: flex; justify-content: center; padding: 40px; }
  </style>
</head>
<body>

<!-- NAV -->
<nav class="navbar">
  <a class="navbar-brand" href="/">
    <span>🐬</span> Lost & Found
  </a>
  <div class="navbar-spacer"></div>

  {% if user %}
    <a class="nav-report-btn" href="/post/new">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      Report
    </a>
    <div class="nav-avatar-wrap">
      <div class="nav-avatar" id="navAvatar" onclick="toggleDropdown()">
        {% if user.photo %}
          <img src="{{ user.photo }}" alt="avatar" />
        {% else %}
          {{ user.name[0]|upper }}
        {% endif %}
      </div>
      <div class="nav-dropdown" id="navDropdown">
        <a href="/profile">👤 Profile</a>
        {% if user.is_admin %}<a href="/admin">⚙️ Admin</a>{% endif %}
        <form action="/logout" method="post" style="margin:0">
          <button type="submit" class="danger">Sign Out</button>
        </form>
      </div>
    </div>
  {% else %}
    <a class="nav-login-btn" href="/login">Sign In</a>
  {% endif %}
</nav>

<!-- PAGE CONTENT -->
{% block content %}{% endblock %}

<!-- TOAST -->
<div id="toast"></div>

<!-- FIREBASE SDK (modular v10) -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
  import { getAuth, signInWithPopup, GoogleAuthProvider, signOut } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';
  import { getFirestore } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
  import { getStorage } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js';

  const cfg = {{ firebase_cfg | safe }};
  const app  = initializeApp(cfg);
  const auth = getAuth(app);
  const db   = getFirestore(app);
  const stor = getStorage(app);

  window._fb = { app, auth, db, stor, GoogleAuthProvider, signInWithPopup, signOut };
  window.dispatchEvent(new Event('firebase-ready'));
</script>

<script>
  function toggleDropdown() {
    document.getElementById('navDropdown').classList.toggle('open');
  }
  document.addEventListener('click', e => {
    const wrap = document.getElementById('navAvatar');
    if (wrap && !wrap.closest('.nav-avatar-wrap').contains(e.target)) {
      document.getElementById('navDropdown')?.classList.remove('open');
    }
  });

  function showToast(msg, duration = 2500) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), duration);
  }

  function timeAgo(val) {
    if (!val) return '';
    const d = val?.seconds ? new Date(val.seconds * 1000) : new Date(val);
    const diff = (Date.now() - d) / 1000;
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff/60) + 'm ago';
    if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff/86400) + 'd ago';
    return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
  }

  function getRoleLabel(email) {
    const local = (email||'').split('@')[0];
    return /\d{4}$/.test(local) ? 'Student' : 'Faculty';
  }
</script>

{% block scripts %}{% endblock %}
</body>
</html>
